    <title>Abans Group | One Abans</title>
    
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --abans-primary: #7e1974;
        --abans-dark: #4a0d44;
        --abans-light: #b02e9e;
        --abans-accent: #ffd700; /* Gold accent for premium feel */
        --abans-gradient: linear-gradient(135deg, #7e1974 0%, #b320a5 100%);
        --abans-gradient-gold: linear-gradient(135deg, #FFD700 0%, #FDB931 100%);
        --font-sans: 'Inter', sans-serif;
        --font-heading: 'Montserrat', sans-serif;
      }

      body {
        font-family: var(--font-sans);
        overflow-x: hidden;
        background-color: #ffffff;
        color: #333;
      }

      h1, h2, h3, h4, h5, h6 {
        font-family: var(--font-heading);
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      /* Premium Buttons */
      .btn-custom {
        background: var(--abans-gradient);
        border: none;
        border-radius: 50px;
        color: white;
        padding: 14px 36px;
        font-weight: 600;
        letter-spacing: 0.5px;
        transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        position: relative;
        overflow: hidden;
        z-index: 1;
      }
      .btn-custom::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(135deg, #5a1253 0%, #911883 100%);
        z-index: -1;
        transition: opacity 0.4s ease;
        opacity: 0;
      }
      .btn-custom:hover::before {
        opacity: 1;
      }
      .btn-custom:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 30px rgba(126, 25, 116, 0.4);
        color: white;
      }

      /* Gradient Border Cards */
      .gradient-border-card {
        position: relative;
        background: #fff;
        border-radius: 24px;
        z-index: 1;
        transition: transform 0.4s ease, box-shadow 0.4s ease;
        height: 100%;
        border: 1px solid rgba(0,0,0,0.05);
      }
      .gradient-border-card::after {
        content: "";
        position: absolute;
        inset: -2px;
        border-radius: 26px;
        background: var(--abans-gradient);
        z-index: -1;
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      .gradient-border-card:hover::after {
        opacity: 1;
      }
      .gradient-border-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 20px 40px rgba(126, 25, 116, 0.1);
        border-color: transparent;
      }

      /* Abstract Backgrounds */
      .bg-abstract-blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.15;
        z-index: 0;
      }
      .blob-primary {
        background: var(--abans-primary);
      }
      .blob-accent {
        background: var(--abans-accent);
      }
      .blob-blue {
        background: #4facfe;
      }

      /* Typography Utilities */
      .text-gradient {
        background: var(--abans-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        color: transparent;
      }
      .text-balance {
        text-wrap: balance;
      }

      /* Navbar */
      .navbar-glass {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        box-shadow: 0 2px 20px rgba(0,0,0,0.05);
      }

      /* Animations */
      @keyframes float-slow {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
      }
      .animate-float {
        animation: float-slow 6s ease-in-out infinite;
      }
    </style>
